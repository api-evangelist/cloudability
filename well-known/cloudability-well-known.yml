source: >-
  Live anonymous GET of eight /.well-known/ paths against every host this record
  names — the registrable domain and www, each apis[].baseURL host, the console
  host and the documentation host — on 2026-09-05.
description: >-
  Well-known discovery probe for the Cloudability / IBM Apptio hosts. Exactly one
  real document was served: IBM's corporate PSIRT security.txt on www.ibm.com,
  the documentation host for every Cloudability API entry in this record. No
  cloudability.com or apptio.com host serves any well-known document. Two false
  positives were rejected and are recorded below with the reason.
notes:
  - >-
    api.cloudability.com answers 401 with a JSON error envelope on EVERY path,
    including a control probe for a path that does not exist
    (/zzz-does-not-exist-9482 -> 401). The 401s below therefore carry no
    information about whether a document exists; they are a blanket auth wall.
  - >-
    app.cloudability.com answers 200 with the same SPA HTML shell
    (<title>Cloudability</title>) for every /.well-known/* path. Per the pipeline
    rule a 200 returning an SPA shell is NOT a document; all eight are recorded
    as misses.
  - >-
    www.ibm.com/.well-known/security.txt is IBM's corporate PSIRT document, not a
    Cloudability-specific one. It is recorded because www.ibm.com is the
    documentation host named by every apis[] entry in this record and IBM is the
    owner of the Cloudability product; the disclosure route it publishes is the
    route a Cloudability researcher is expected to use.
