    language: Go
    official: true
    registry: helm
    registry_url: https://cloudability.github.io/metrics-agent
    repository: https://github.com/cloudability/metrics-agent
    docs: https://cloudability.github.io/metrics-agent/
    license: Apache-2.0
    version: 2.14.15
    published: '2026-08-21'
    note: >-
      Helm chart index entry `metrics-agent`, appVersion 2.14.15, created
      2026-08-21T19:42:10Z. First-party: published from the cloudability GitHub
      org with homepage https://www.cloudability.com/. DEPRECATED — IBM
      documentation states the legacy metrics agent "will reach end of
