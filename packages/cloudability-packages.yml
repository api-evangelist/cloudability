findings:
  - >-
    No first-party REST SDK exists for the Cloudability v3 API in any language
    registry. IBM ships example scripts and a git-only Python helper library
    instead, and points API consumers at two Postman collections.
  - >-
    Every first-party package that IS published is a Kubernetes cost-collection
    agent rather than an API client, and the flagship one (metrics-agent) carries
    a published end-of-functionality date of 2026-11-19.
  - >-
    All three registry packages bearing the Cloudability name (npm, RubyGems,
    PyPI) are third-party and two of them have been unmaintained for a decade —
    a consumer searching a registry for "cloudability" finds only abandoned code.
