specification: API Commons Packages
specificationVersion: '0.1'
provider: Cloudability
providerId: cloudability
generated: '2026-09-05'
modified: '2026-09-05'
method: searched
source: >-
  Registry metadata read live 2026-09-05 from api.github.com (cloudability + IBM
  orgs), the Helm chart indexes at cloudability.github.io/metrics-agent and
  kubecost.github.io/finops-agent-chart, hub.docker.com, proxy.golang.org,
  registry.npmjs.org, rubygems.org and pypi.org. Cloudability is an IBM Apptio
  product, so first-party code is published under both the github.com/cloudability
  and github.com/IBM organizations.
description: >-
  Client libraries, agents and deployment artifacts for the Cloudability API
  surface. Cloudability publishes no conventional REST SDK for the v3 API in any
  language registry; its first-party published software is the Kubernetes
  metrics/FinOps collection agent (Go, Helm, Docker) and a small Python helper
  library used by IBM's own example scripts. The three registry packages that
  carry the Cloudability name on npm, RubyGems and PyPI are unmaintained
  third-party wrappers, not vendor SDKs.
packages:
